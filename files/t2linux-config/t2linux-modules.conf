# Loaded by systemd-modules-load.service. The t2bce bridge drivers have to be
# present before udev scans the T2's PCI devices, which is why they are listed
# here as well as being built into vmlinuz by the kernel config fragment.
#
# Vendor order from t2linux-config 16.0.0: the DMA bridge must be up before the
# core bridge, and the virtual USB host controller last.
t2bce_dma
t2bce_core
t2bce_vhci
